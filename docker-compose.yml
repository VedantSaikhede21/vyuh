# Offline full stack: `docker compose up` starts Postgres, the API and the web app
# with local auth and the LLM off. Open http://localhost:3000. No network needed
# once the images are built; all terrain, renders and fonts are in the images.
#
# Development: `docker compose up -d postgres` starts the database only.
# Known issue: an older container holding :5432 (CLAUDE.md §14) blocks `up`; set
# POSTGRES_PORT to another port for the offline stack (only the host port changes).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyuh
      POSTGRES_PASSWORD: vyuh # local only: never used outside this container
      POSTGRES_DB: vyuh
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vyuh -d vyuh']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: offline
      DATABASE_URL: postgresql+psycopg://vyuh:vyuh@postgres:5432/vyuh
      AUTH_MODE: local
      # One machine, no network: a fixed local secret is fine here and only here.
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-offline-local-only-secret-change-for-shared-use}
      CORS_ORIGINS: http://localhost:3000
      LLM_ENABLED: 'false'
      OPEN_METEO_ENABLED: 'false'
      GUEST_MODE_ENABLED: 'false'
    ports:
      - '8000:8000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_AUTH_MODE: local
        NEXT_PUBLIC_GUEST_MODE: 'false'
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  pgdata:
