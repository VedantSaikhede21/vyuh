[project]
name = "vyuh-signatures"
version = "0.1.0"
description = "VYUH micro-Doppler spectrogram templates (SPEC §6.4): numpy → PNG per class family"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
